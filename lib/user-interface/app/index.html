<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/aiep-logo-vertical.svg" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <!-- Fetched by app-configured.tsx before anything renders. Requested here so
         the download starts while the HTML is still parsing, not after the JS
         bundle has run. Same URL and credentials mode as that fetch
         (same-origin), or the browser would discard the preload. -->
    <link rel="preload" href="/aws-exports.json" as="fetch" crossorigin />
    <!-- Bootstrap, LTR build. Declared here rather than injected by the JS so
         the request starts with the document. src/common/direction.ts swaps the
         href to the RTL build for Arabic, and only then. It must come before the
         icon font and every other stylesheet so custom CSS keeps winning the
         cascade. -->
    <link id="bootstrap-css" rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <!-- Icon font is served from public/vendor (synced by scripts/sync-bootstrap.cjs)
         instead of being imported in main.tsx: Vite 4 production builds leave the
         font url()s as unreplaced __VITE_ASSET__ placeholders, breaking every bi-* glyph -->
    <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://use.typekit.net/sdn7ohf.css">
    <!-- Google Fonts are self-hosted from public/fonts (see its README). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e1b2a"
    />
    <!-- The home page's title and description. common/page-meta.ts rewrites
         them, with the canonical link and og:url, on every other public page
         and in the parent's language; keep these equal to meta.home.* in
         src/translations/en.json. -->
    <meta name="description" content="A free tool for parents. Upload your child&#39;s IEP and get a plain-language summary, the key services and accommodations, and every term explained, in your language." />
    <link rel="canonical" href="https://a-iep.org/" />
    <!-- How a shared link previews in messages, email and social apps. Relative
         og:image would be ignored by most readers, so it names the production
         host; staging previews show production's card, which is harmless. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A-IEP" />
    <meta property="og:title" content="A-IEP: understand your child&#39;s IEP in plain language" />
    <meta property="og:url" content="https://a-iep.org/" />
    <meta property="og:description" content="A free tool for parents. Upload your child&#39;s IEP and get a plain-language summary, the key services and accommodations, and every term explained, in your language." />
    <meta property="og:image" content="https://a-iep.org/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The A-IEP logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <title>A-IEP: understand your child&#39;s IEP in plain language</title>
    <!-- Structured data for search results. A data block, not a script: the
         browser never runs it, so the CSP does not hash it
         (content-security-policy.ts#inlineScriptHashes). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "A-IEP",
        "alternateName": "AI for Individualized Education Programs",
        "url": "https://a-iep.org/",
        "sameAs": ["https://github.com/The-Burnes-Center/a-iep"],
        "description": "A free tool that helps parents understand their child's IEP: a plain-language summary, the key services and accommodations, and every term explained, in English, Spanish, Chinese or Vietnamese.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["en", "es", "zh", "vi"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": {
          "@type": "Organization",
          "name": "The Burnes Center for Social Change",
          "parentOrganization": { "@type": "CollegeOrUniversity", "name": "Northeastern University", "url": "https://www.northeastern.edu/" },
          "url": "https://burnes.northeastern.edu/",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "416 Huntington Ave",
            "addressLocality": "Boston",
            "addressRegion": "MA",
            "postalCode": "02115",
            "addressCountry": "US"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "info@thegovlab.org",
            "url": "https://a-iep.org/public-privacy-policy#contact"
          }
        }
      }
    </script>
    <script>
      const global = window.global || window;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
