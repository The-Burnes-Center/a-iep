<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/aiep-logo-vertical.svg" />
    <!-- Fetched by app-configured.tsx before anything renders. Requested here so
         the download starts while the HTML is still parsing, not after the JS
         bundle has run. Same URL and credentials mode as that fetch
         (same-origin), or the browser would discard the preload. -->
    <link rel="preload" href="/aws-exports.json" as="fetch" crossorigin />
    <!-- Bootstrap, LTR build. Declared here rather than injected by the JS so
         the request starts with the document. src/common/direction.ts swaps the
         href to the RTL build for Arabic, and only then. It must come before the
         icon font and every other stylesheet so custom CSS keeps winning the
         cascade. -->
    <link id="bootstrap-css" rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <!-- Icon font is served from public/vendor (synced by scripts/sync-bootstrap.cjs)
         instead of being imported in main.tsx: Vite 4 production builds leave the
         font url()s as unreplaced __VITE_ASSET__ placeholders, breaking every bi-* glyph -->
    <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://use.typekit.net/sdn7ohf.css">
    <!-- Google Fonts are self-hosted from public/fonts (see its README). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e1b2a"
    />
    <meta name="description" content="A tool to help you better understand IEP documents" />
    <link rel="manifest" href="/manifest.json" />
    <title>AIEP</title>
    <script>
      const global = window.global || window;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
