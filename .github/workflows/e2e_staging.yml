name: E2E (staging)

# Phase 3 of the testing protocol: Playwright drives the real staging site
# through the critical journeys (login via the OTP backdoor, wrong-OTP
# lockout, language plumbing, and the delete-account-then-re-signup incident
# repro). Reusable so the staging deploy runs it after smoke and the nightly
# schedule runs it with the slow document-pipeline spec enabled.
on:
  workflow_call:
    inputs:
      run_pipeline:
        description: 'Also run the @pipeline document-upload spec (slow, costs LLM calls)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: E2E journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The journeys share stateful test users (+1555555011x/012x), so two E2E
    # runs must never overlap: a deploy-triggered run and the nightly queue
    # behind each other instead.
    concurrency:
      group: e2e-staging-users
      cancel-in-progress: false
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite resolves the CloudFront URL and user pool from the
      # AIEPStagingStack outputs and reads the OTP backdoor's SSM params.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run E2E journeys
        run: npx playwright test
        env:
          RUN_PIPELINE_E2E: ${{ inputs.run_pipeline && '1' || '' }}

      # Traces and screenshots only exist for failures; the users and the
      # fixture document are synthetic, so the artifact holds no real PII.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
