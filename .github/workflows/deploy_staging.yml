name: Deploy A-IEP Tool to AWS Staging Env

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging

    steps:
    # Step 1: Check out the repository's code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Node.js with the version required by your project
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # Use Node.js version 20.x, which is compatible with "@types/node": "20.12.7"
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          lib/user-interface/app/package-lock.json

    # Step 3: Install backend dependencies (from the root folder)
    - name: Install backend dependencies
      run: npm install  # No need to cd into valorant-dotbot

    # Step 4: Install frontend dependencies (in 'lib/user-interface/app')
    - name: Install frontend dependencies
      run: |
        cd lib/user-interface/app
        npm install

    # Step 5: Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Step 6: Bootstrap the AWS environment (from the root folder)
    - name: Bootstrap AWS environment
      run: npx cdk bootstrap

    # Cache CDK bundled Lambda assets. Assets use assetHashType SOURCE, so cdk
    # skips Docker bundling for any asset already staged in a restored cdk.out;
    # only assets whose source actually changed are re-bundled.
    - name: Cache CDK bundled assets
      uses: actions/cache@v4
      with:
        path: cdk.out
        key: cdk-out-${{ hashFiles('lib/chatbot-api/functions/**') }}
        restore-keys: |
          cdk-out-

    # Step 7: Deploy the CDK stack (from the root folder)
    - name: Deploy CDK stack
      run: npx cdk deploy AIEPStagingStack --require-approval never
      env:
        ENVIRONMENT: staging
        ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN_STAGING }}
        DOMAIN: ${{ secrets.DOMAIN_STAGING }}

    # Step 8: Fetch CloudFormation outputs and save to a file
    - name: Fetch CloudFormation Outputs
      run: |
        aws cloudformation describe-stacks --stack-name AIEPStagingStack --query "Stacks[0].Outputs" > stack-outputs.json
        cat stack-outputs.json  # Just to verify in logs if needed

    # Step 9: Upload the output file as an artifact (optional)
    - name: Upload Outputs as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stack-outputs
        path: stack-outputs.json