name: Deploy A-IEP Tool to AWS Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One prod deploy at a time: the CloudFormation stack is the contended
# resource, so the group is per-workflow rather than per-ref (this also
# serializes workflow_dispatch runs). cancel-in-progress stays false: never
# kill a CloudFormation update mid-flight. A newer queued run supersedes any
# older queued run automatically.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: the four CI jobs (jest, pytest, frontend, CDK synth) must pass on
  # this exact commit before anything deploys. Running CI as a reusable
  # workflow inside this run means same SHA by construction, with no cross-
  # workflow race against the standalone CI run.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENVIRONMENT: production

    steps:
    # Step 1: Check out the repository's code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Node.js with the version required by your project
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # Use Node.js version 20.x, which is compatible with "@types/node": "20.12.7"
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          lib/user-interface/app/package-lock.json

    # Step 3: Install backend dependencies (from the root folder)
    - name: Install backend dependencies
      run: npm ci

    # Step 4: Install frontend dependencies (in 'lib/user-interface/app')
    - name: Install frontend dependencies
      run: |
        cd lib/user-interface/app
        npm ci

    # Step 5: Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Step 6: Bootstrap the AWS environment (from the root folder)
    - name: Bootstrap AWS environment
      run: npx cdk bootstrap

    # Cache CDK bundled Lambda assets. Assets use assetHashType SOURCE, so cdk
    # skips Docker bundling for any asset already staged in a restored cdk.out;
    # only assets whose source actually changed are re-bundled.
    - name: Cache CDK bundled assets
      uses: actions/cache@v4
      with:
        path: cdk.out
        key: cdk-out-${{ hashFiles('lib/chatbot-api/functions/**') }}
        restore-keys: |
          cdk-out-

    # Step 7: Deploy the CDK stack (from the root folder)
    - name: Deploy CDK stack
      run: npx cdk deploy AIEPStack --require-approval never
      env:
        ENVIRONMENT: production
        ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN_PROD }}
        DOMAIN: ${{ secrets.DOMAIN_PROD }}

  # Phase 2 of the testing protocol: every deploy verifies itself. Read-only,
  # SMS-free checks (auth contract, site bundle, API liveness) resolved from
  # stack outputs; a failure turns this workflow red within minutes instead
  # of shipping silently broken (see PR #51).
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Run smoke tests
      run: bash scripts/smoke-test.sh AIEPStack production
