name: CI

# Phase 1 of the testing protocol: every PR (and every push to staging or
# main) runs the unit suites and static checks in parallel. Nothing here
# needs AWS credentials; cdk synth is credential-free with --no-staging.
#
# workflow_call makes this reusable: both deploy workflows run it as their
# first job (needs: ci), so a deploy is structurally impossible on a commit
# whose tests fail (including workflow_dispatch deploys of arbitrary refs).
on:
  pull_request:
  push:
    branches:
      - staging
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# github.workflow resolves to the CALLER's workflow name when this file runs
# as a reusable workflow, so embedded runs can never share a group with (and
# cancel) the standalone CI run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-lambda-tests:
    name: Auth lambda unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Guards the phone-OTP custom auth flow (define/create/verify triggers,
      # SMS localization, log redaction) — the layer behind the 2026-07
      # silent-signup-outage incident — plus the pdf-generator sanitizer and
      # the ESM knowledge-management handlers. npm test wraps jest with
      # --experimental-vm-modules, which the .mjs suites need.
      - name: Run jest suites
        run: npm test -- --silent

  python-lambda-tests:
    name: Python lambda unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches lambda.Runtime.PYTHON_3_12 across the stack
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/python/requirements.txt

      - name: Install test dependencies
        run: pip install -r test/python/requirements.txt

      - name: Run pytest suites
        run: pytest -q

  # Unit tests mock the AI SDKs, so they cannot see two pinned packages that
  # are each valid but incompatible with each other. That exact failure shipped
  # on 2026-07-28: openai 2.45.0 made InputTokensDetails.cache_write_tokens
  # required, openai-agents 0.4.2 does not pass it, and every document failed
  # at the parsing step until the nightly E2E caught it. This job installs each
  # distinct lambda requirements set on the runner (linux x86_64 / py3.12, same
  # as the Lambda runtime) and imports the SDKs, which fails in about a minute
  # instead of after a deploy.
  lambda-deps:
    name: Lambda dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and import each distinct requirements set
        run: |
          set -euo pipefail
          # The step lambdas share a handful of identical files; install each
          # unique one once, keyed by content hash.
          declare -A seen
          status=0
          while IFS= read -r req; do
            hash=$(sha256sum "$req" | cut -d' ' -f1)
            if [[ -n "${seen[$hash]:-}" ]]; then
              echo "== $req (same contents as ${seen[$hash]}, skipping)"
              continue
            fi
            seen[$hash]="$req"
            echo "== $req"
            rm -rf /tmp/depcheck && python -m venv /tmp/depcheck
            /tmp/depcheck/bin/pip install -q --disable-pip-version-check -r "$req"
            # Import what the handlers import; constructing Usage() is the
            # specific call that the openai/openai-agents mismatch broke.
            /tmp/depcheck/bin/python - <<'PY' || status=1
          import importlib
          for mod in ("boto3", "openai", "pydantic", "mistralai", "agents"):
              try:
                  importlib.import_module(mod)
              except ImportError:
                  continue  # not every lambda pulls every SDK
          try:
              from agents.usage import Usage
          except ImportError:
              pass
          else:
              Usage()
              print("  agents.Usage() OK")
          print("  imports OK")
          PY
          done < <(find lib/chatbot-api/functions/metadata-handler -name requirements.txt | sort)
          exit $status

  frontend:
    name: Frontend typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lib/user-interface/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lib/user-interface/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Vitest + jsdom, run from lib/user-interface/app (see vitest.config.ts
      # for why these do not live in the root jest projects). Covers the React
      # wiring the E2E journeys cannot reach — most importantly the
      # userConfirmed=false two-code signup fallback, which a journey asserting
      # a single SMS is structurally unable to exercise.
      - name: Unit tests
        run: npm test

  infra-synth:
    name: CDK typecheck and synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Synth production stack
        run: npx cdk synth AIEPStack --no-staging --quiet
        env:
          ENVIRONMENT: production

      - name: Synth staging stack
        run: npx cdk synth AIEPStagingStack --no-staging --quiet
        env:
          ENVIRONMENT: staging
