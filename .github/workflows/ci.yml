name: CI

# Phase 1 of the testing protocol: every PR (and every push to staging) runs
# the unit suites and static checks in parallel. Nothing here needs AWS
# credentials; cdk synth is credential-free with --no-staging.
on:
  pull_request:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-lambda-tests:
    name: Auth lambda unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Guards the phone-OTP custom auth flow (define/create/verify triggers,
      # SMS localization, log redaction) — the layer behind the 2026-07
      # silent-signup-outage incident — plus the pdf-generator sanitizer and
      # the ESM knowledge-management handlers. npm test wraps jest with
      # --experimental-vm-modules, which the .mjs suites need.
      - name: Run jest suites
        run: npm test -- --silent

  python-lambda-tests:
    name: Python lambda unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches lambda.Runtime.PYTHON_3_12 across the stack
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/python/requirements.txt

      - name: Install test dependencies
        run: pip install -r test/python/requirements.txt

      - name: Run pytest suites
        run: pytest -q

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lib/user-interface/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the changed-file lint can diff against the base
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lib/user-interface/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The full `npm run lint` still fails on ~136 pre-existing errors
      # (tracked burn-down). Until that lands, lint blocks on the files a
      # change touches so new code stays clean without freezing all work.
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ''|0000000000000000000000000000000000000000)
              echo "No base commit to diff against; skipping changed-file lint."
              exit 0 ;;
          esac
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base commit $BASE_SHA unavailable; skipping changed-file lint."
            exit 0
          fi
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=d "$BASE_SHA"...HEAD \
            | grep -E '^lib/user-interface/app/src/.*\.(ts|tsx)$' \
            | sed 's|^lib/user-interface/app/||' || true)
          if [ -z "$changed" ]; then
            echo "No frontend source changes to lint."
            exit 0
          fi
          echo "Linting changed files:" && echo "$changed"
          echo "$changed" | xargs npx eslint --max-warnings 0 --report-unused-disable-directives

  infra-synth:
    name: CDK typecheck and synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Synth production stack
        run: npx cdk synth AIEPStack --no-staging --quiet
        env:
          ENVIRONMENT: production

      - name: Synth staging stack
        run: npx cdk synth AIEPStagingStack --no-staging --quiet
        env:
          ENVIRONMENT: staging
